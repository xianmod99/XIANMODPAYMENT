
name: XIANMOD PAYMENT - Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIANMOD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xianmod.p12"
            echo "XIANMOD_KEYSTORE_FILE=$RUNNER_TEMP/xianmod.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret XIANMOD_KEYSTORE_BASE64 belum diisi. APK memakai kunci debug acak, update harus uninstall dulu."
          fi

      - name: Build Debug APK
        env:
          XIANMOD_KEYSTORE_PASSWORD: ${{ secrets.XIANMOD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Generate SHA256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XIANMOD-PAYMENT-DEBUG
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
